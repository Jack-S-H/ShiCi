<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/popup.css" />
</head>
<body>
    <header>
            <h3>弹窗</h3>
            <button id="openOptions">设置</button>
    </header>
    <main>
        <label for="searchinput" class="searchbox">搜索单词：
            <input type="text" id="searchinput" placeholder="输入搜索内容" autofocus>
            <div id="suggestions">
            </div>
        </label>
        <label for="saveword" class="savewordbox">录入单词：
            <input type="text" id="saveword" placeholder="输入要录入的单词">
            <button type="button" id="savewordBtn">提交</button>
        </label>
        <div>
            <span>单词导入和导出：</span>
            <div id="import">
                <input type="file" id="importFile" accept=".json,.txt">
                <button type="button" id="importBtn">导入</button>
            </div>
            <button type="button" id="exportBtn">单词导出</button>
        </div>
        <dialog id="importDialog">
            <form method="dialog">
                <button value="confirm">确认</button>
            </form>
        </dialog>
    </main>
    <script src="../scripts/popup.js" type="module"></script>
</body>

</html>
